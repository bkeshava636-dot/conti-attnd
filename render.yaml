services:
  - type: web
    name: contineo-attendance-tracker
    runtime: node
    plan: free
    region: singapore # Closest to India / BITM Ballari
    buildCommand: npm install --include=dev && npm run build
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PROCTOR_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
