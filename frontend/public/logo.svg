<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bitmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bitmGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
  
  <!-- Academic Mortarboard Top -->
  <path d="M50 18 L82 33 L50 47 L18 33 Z" fill="url(#capGrad)" />
  <path d="M50 47 L82 33 L82 41 L50 54 L18 41 L18 33 Z" fill="#ffffff" opacity="0.22" />
  <!-- Tassel -->
  <path d="M76 36 L76 50 C76 52 73 54 70 54" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Attendance Verified Checkmark Emblem -->
  <circle cx="50" cy="56" r="13" fill="#0b0f17" />
  <circle cx="50" cy="56" r="13" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <path d="M44 56.5 L48 60.5 L57 51" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- BITM Monogram Banner -->
  <text x="50" y="85" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="13" font-weight="800" letter-spacing="2">BITM</text>
</svg>
